<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Slots — CJ Klinik Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="slots">
<div class="s-shell">
  <div id="staff-sidebar"></div>
  <div class="s-main">
    <div id="staff-topbar"></div>
    <div class="s-content">
      <p class="section-sub" data-i18n="slots_sub"></p>
      <div class="weekslot-toolbar">
        <div class="weekslot-nav">
          <button type="button" class="btn btn-outline btn-sm" id="slots-prev-week" data-i18n="slots_prevWeek"></button>
          <button type="button" class="btn btn-outline btn-sm" id="slots-this-week" data-i18n="slots_thisWeek"></button>
          <button type="button" class="btn btn-outline btn-sm" id="slots-next-week" data-i18n="slots_nextWeek"></button>
          <span class="weekslot-label" id="slots-week-label"></span>
        </div>
        <div class="weekslot-actions">
          <button type="button" class="btn btn-outline btn-sm" id="slots-copy-prev" data-i18n="slots_copyPrev"></button>
          <button type="button" class="btn btn-outline btn-sm" id="slots-clear-week" data-i18n="slots_clearWeek"></button>
          <button type="button" class="btn btn-primary" id="slots-save-week" data-i18n="slots_saveWeek"></button>
        </div>
      </div>
      <p class="note" data-i18n="slots_hint"></p>
      <div id="slots-grid"></div>
      <p class="weekslot-status" id="slots-status"></p>
    </div>
  </div>
</div>

<script src="/assets/content.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/staff-chrome.js"></script>
<script src="/assets/page-staff-slots.js"></script>
</body>
</html>
