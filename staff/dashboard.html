<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — CJ Klinik Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="dashboard">
<div class="s-shell">
  <div id="staff-sidebar"></div>
  <div class="s-main">
    <div id="staff-topbar"></div>
    <div class="s-content">
      <div class="grid dash-grid" style="margin-bottom:24px">
        <div class="card dash-stat"><div class="num" id="dash-new-appts">–</div><div class="lbl" data-i18n="dash_newAppts"></div></div>
        <div class="card dash-stat"><div class="num" id="dash-notice-icon">–</div><div class="lbl" id="dash-notice-label"></div></div>
        <div class="card dash-stat"><div class="num" id="dash-doctor-count">–</div><div class="lbl" data-i18n="doctors_title"></div></div>
      </div>
      <h3 data-i18n="dash_quickLinks"></h3>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        <a class="btn btn-outline" href="/staff/slots">🩺 <span data-i18n="staff_slots"></span></a>
        <a class="btn btn-outline" href="/staff/notices">📢 <span data-i18n="staff_notices"></span></a>
        <a class="btn btn-outline" href="/staff/sheets">📊 <span data-i18n="staff_sheets"></span></a>
        <a class="btn btn-outline" href="/staff/guidelines">📘 <span data-i18n="staff_guidelines"></span></a>
      </div>
    </div>
  </div>
</div>

<script src="/assets/content.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/staff-chrome.js"></script>
<script src="/assets/page-staff-dashboard.js"></script>
</body>
</html>
