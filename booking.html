<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment — CJ Klinik</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="booking">
<div id="site-header"></div>

<div class="section">
  <h2 class="section-title" data-i18n="booking_title"></h2>
  <p class="section-sub" data-i18n="booking_subtitle"></p>
  <div id="booking-message"></div>
  <div class="grid booking-wrap">
    <form class="card" id="booking-form">
      <div class="field"><label data-i18n="booking_name"></label><input required name="name" type="text"></div>
      <div class="field"><label data-i18n="booking_phone"></label><input required name="phone" type="tel" inputmode="tel" autocomplete="tel" data-i18n-placeholder="booking_phonePlaceholder"></div>
      <div class="field"><label data-i18n="booking_email"></label><input name="email" type="email" inputmode="email" autocomplete="email" data-i18n-placeholder="booking_emailPlaceholder"></div>
      <div class="field"><label data-i18n="booking_date"></label><input required name="date" type="date" id="booking-date"></div>
      <div class="field"><label data-i18n="booking_time"></label>
        <div class="time-slot-grid" id="booking-time-grid"></div>
        <input type="hidden" name="time" id="booking-time-value">
      </div>
      <div class="field"><label data-i18n="booking_service"></label>
        <select name="service" id="booking-service"></select>
      </div>
      <div class="field"><label data-i18n="booking_doctorPref"></label>
        <select name="doctor" id="booking-doctor"></select>
      </div>
      <div class="field"><label data-i18n="booking_notes"></label><textarea name="notes" rows="3"></textarea></div>
      <button class="btn btn-primary" type="submit" id="booking-submit-btn"></button>
    </form>
    <div class="card booking-info-card">
      <h3 data-i18n="booking_infoTitle"></h3>
      <ul>
        <li data-i18n="booking_info1"></li>
        <li data-i18n="booking_info2"></li>
        <li data-i18n="booking_info3"></li>
      </ul>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="/assets/content.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/customer-chrome.js"></script>
<script src="/assets/page-booking.js"></script>
</body>
</html>
