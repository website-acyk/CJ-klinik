<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJ Klinik — Trusted Family Clinic in Jelutong, Penang</title>
<meta name="description" content="CJ Klinik offers trusted medical, therapy and aesthetic services in Jelutong, Penang.">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="home">
<div id="site-header"></div>

<div class="hero"><div class="hero-inner">
  <div>
    <a class="hero-loc-pill" id="hero-loc-pill" target="_blank" rel="noopener"></a>
    <h1 data-i18n="home_heroTitle"></h1>
    <p data-i18n="home_heroSub"></p>
    <a class="btn btn-primary" href="/booking" data-i18n="home_heroCta"></a>
  </div>
  <div class="hero-art"><img src="/assets/img/KlinikCJ.jpg" alt="CJ Klinik reception and waiting area"></div>
</div></div>

<div class="highlights-band">
  <div class="highlights-band-inner">
    <div class="highlight-item"><span class="hi-ico">🚶</span><span data-i18n="visit_walkins"></span></div>
    <div class="highlight-item"><span class="hi-ico">🔒</span><span data-i18n="highlight_discreet"></span></div>
    <div class="highlight-item"><span class="hi-ico">👩‍⚕️</span><span data-i18n="highlight_doctors"></span></div>
    <div class="highlight-item"><span class="hi-ico">🤝</span><span data-i18n="highlight_panel"></span></div>
  </div>
</div>

<div class="section">
  <h2 class="section-title" data-i18n="home_servicesTitle"></h2>
  <div class="grid services-grid" id="services-grid"></div>
</div>

<div class="section" style="padding-top:0">
  <h2 class="section-title" data-i18n="fullServices_title"></h2>
  <div class="card"><div class="grid full-service-grid" id="full-service-grid"></div></div>
</div>

<div class="section" style="padding-top:0">
  <h2 class="section-title" data-i18n="home_facilitiesTitle"></h2>
  <div class="grid facility-list" id="facility-list"></div>
</div>

<div class="section" style="padding-top:0">
  <h2 class="section-title" data-i18n="healthTips_title"></h2>
  <div class="grid healthtip-grid" id="healthtip-grid"></div>
</div>

<div class="section trust-section" style="padding-top:0">
  <h2 class="section-title" data-i18n="trusted_title"></h2>
  <div class="card">
    <div class="trust-group">
      <div class="trust-group-label" data-i18n="trusted_panel"></div>
      <div class="trust-badges" id="trust-panel"></div>
    </div>
    <div class="trust-group" style="margin-bottom:0">
      <div class="trust-group-label" data-i18n="trusted_corporate"></div>
      <div class="trust-badges-marquee"><div class="trust-badges-track" id="trust-corporate"></div></div>
    </div>
  </div>
</div>

<div class="section visit-section" style="padding-top:0">
  <h2 class="section-title" data-i18n="visit_title"></h2>
  <div class="grid visit-grid">
    <div class="card">
      <div class="visit-row"><span class="visit-ico">📍</span><div><div class="visit-label" data-i18n="visit_address"></div><a class="map-link" id="visit-address-link" target="_blank" rel="noopener"></a></div></div>
      <div class="visit-row"><span class="visit-ico">📞</span><div><div class="visit-label" data-i18n="visit_phone"></div><a class="map-link" id="visit-phone-link"></a></div></div>
      <div class="visit-row"><span class="visit-ico">💬</span><div><div class="visit-label" data-i18n="visit_whatsapp"></div><a class="map-link" id="visit-whatsapp-link" target="_blank" rel="noopener"></a></div></div>
      <div class="visit-row"><span class="visit-ico">✉️</span><div><div class="visit-label" data-i18n="visit_email"></div><a class="map-link" id="visit-email-link"></a></div></div>
    </div>
    <div class="card">
      <div class="visit-label" style="margin-bottom:10px">🕒 <span data-i18n="visit_hours"></span></div>
      <table><tbody id="hours-body"></tbody></table>
      <div class="note" style="margin-top:14px">🚶 <span data-i18n="visit_walkins"></span></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="/assets/content.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/customer-chrome.js"></script>
<script src="/assets/page-home.js"></script>
</body>
</html>
